name: release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: ceph
  CEPH_SOURCE_IMAGE: quay.io/ceph/ceph

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: articulate/actions-markdownlint@v1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck on entrypoint.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'

  build:
    strategy:
      matrix:
        version:
          # Squid (19.2.x)
          - '19.2.0'
          - '19.2.1'
          - '19.2.2'
          - '19.2.3'
          - '19.2.4'
          - '19.2.5'
          - '19.2.6'
          # Tentacle (20.2.x)
          - '20.2.0'
          - '20.2.1'
          - '20.2.2'
          - '20.2.3'
          - '20.2.4'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - hadolint
      - markdownlint
      - shellcheck
    steps:
      - name: Define build timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            CEPH_SOURCE_IMAGE: ${{ env.CEPH_SOURCE_IMAGE }}
            CEPH_VERSION=${{ matrix.version }}
          file: ./Dockerfile
          platforms: amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:v${{ matrix.version }}
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:v${{ matrix.version }}-${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }},annotation-index.org.opencontainers.image.description=${{ env.IMAGE_NAME }}
