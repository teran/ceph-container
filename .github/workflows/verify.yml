name: verify

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: articulate/actions-markdownlint@v1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck on entrypoint.sh
        uses: ludeeus/action-shellcheck@2
        with:
          scandir: '.'

  build:
    strategy:
      matrix:
        version:
          # Squid (19.2.x)
          - '19.2.0'
          - '19.2.1'
          - '19.2.2'
          - '19.2.3'
          - '19.2.4'
          - '19.2.5'
          - '19.2.6'
          # Tentacle (20.2.x)
          - '20.2.0'
          - '20.2.1'
          - '20.2.2'
          - '20.2.3'
          - '20.2.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image (v${{ matrix.version }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            CEPH_VERSION=${{ matrix.version }}
          push: false
          load: true
